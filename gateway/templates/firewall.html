<!DOCTYPE html>
<html><body>
<h1>Firewall</h1>
<div id='rules'></div>
<button onclick='loadRules()'>Atualizar</button>
<script>
async function loadRules(){
 const r=await fetch('/api/firewall');
 document.getElementById('rules').innerText=JSON.stringify(await r.json(),null,2);
}
loadRules();
</script>
</body></html>
